[package]
name = "ricrac"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rust-embed = "8.12.0"
schemars = { version = "1.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
subtle = "2"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "cors", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
